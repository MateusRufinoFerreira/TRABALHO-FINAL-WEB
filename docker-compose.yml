services:
  db:
    image: postgres:17-alpine
    container_name: provius-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provius_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-provius}
    ports:
      - "5432:5432"
    volumes:
      - provius-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-provius} -d ${POSTGRES_DB:-provius}"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build: .
    container_name: provius-seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-provius}:${POSTGRES_PASSWORD:-provius_dev_2026}@db:5432/${POSTGRES_DB:-provius}?schema=public
      - JWT_SECRET=${JWT_SECRET:-troque_esta_chave_por_um_valor_longo_e_aleatorio_2026}
      - SEED_PROFESSOR_NOME=${SEED_PROFESSOR_NOME:-Thiago}
      - SEED_PROFESSOR_EMAIL=${SEED_PROFESSOR_EMAIL:-thiago@uepb.edu.br}
      - SEED_PROFESSOR_SENHA=${SEED_PROFESSOR_SENHA:-thiago123}
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js"
    restart: "no"

  app:
    build: .
    container_name: provius-app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-provius}:${POSTGRES_PASSWORD:-provius_dev_2026}@db:5432/${POSTGRES_DB:-provius}?schema=public
      - JWT_SECRET=${JWT_SECRET:-troque_esta_chave_por_um_valor_longo_e_aleatorio_2026}
    command: npm run dev
    restart: unless-stopped

volumes:
  provius-pgdata: